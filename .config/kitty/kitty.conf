k# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

# colors from wallpaper (pywal), overrides the theme above
include ~/.cache/wal/colors-kitty.conf

# Padding
window_padding_width 20

# BEGIN_KITTY_FONTS
font_family      family="Cascadia Code NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
